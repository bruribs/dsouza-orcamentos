<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar • DSouza</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main style="max-width:520px;margin:70px auto;padding:20px;">

    <section class="card">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="font-size:13px;font-weight:800;letter-spacing:1.5px;margin-bottom:8px;">
                DSOUZA INTERIORES
            </div>

            <h1 style="margin-bottom:8px;">Acessar sistema</h1>

            <p style="margin:0;">
                Entre com seu usuário e senha para continuar.
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for cat, msg in messages %}
                        <div class="flash {{ cat }}">{{ msg }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <div class="fields">
                <div class="field full">
                    <label for="username">Usuário</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="field full">
                    <label for="password">Senha</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <div class="form-actions" style="margin-top:22px;">
                <button class="btn primary" type="submit" style="width:100%;">
                    Entrar
                </button>
            </div>
        </form>
    </section>

</main>

</body>
</html>
